name: Maturity Contracts

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install '.[dev]'
      - name: Install verified OPA binary
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/opa" https://github.com/open-policy-agent/opa/releases/download/v1.21.1/opa_linux_amd64_static
          echo "668506eb17a2eaa1fce6cc0d1f42ef85125d4ac5bda5fc74d1152d0c77145031  $RUNNER_TEMP/opa" | sha256sum --check
          chmod +x "$RUNNER_TEMP/opa"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test Rego policies
        run: opa test policy/rego -v
      - name: Run offline regression contracts
        run: >-
          python -m pytest -o addopts='' --strict-markers --timeout=30
          tests/test_scan_outcomes.py tests/test_full_pipeline_outcomes.py
          tests/test_distribution.py tests/test_scanner_runners.py
          tests/test_phase_modules.py tests/test_gitleaks_scanner.py
          tests/test_hybrid_cli.py tests/test_opa_policy_hardening.py
          tests/test_week1.py tests/unit/test_trufflehog_scanner.py tests/test_workflow_pinning.py
          tests/test_workflow_security.py tests/test_action_yml_security.py
      - name: Build source and wheel distributions
        run: python -m build --outdir dist
      - name: Verify installed wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/argus-wheel"
          "$RUNNER_TEMP/argus-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/argus-wheel/bin/argus-scan" --help
          "$RUNNER_TEMP/argus-wheel/bin/argus-audit" --help
          "$RUNNER_TEMP/argus-wheel/bin/argus-gate" --help
