name: Scanner Integration Check

on:
  pull_request:
    paths:
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'scripts/**'

permissions:
  contents: read

jobs:
  scanner-integration:
    name: Verify scanner wiring
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi
          pip install pytest

      - name: Run scanner integration tests
        run: pytest tests/test_scanner_integration.py -v
