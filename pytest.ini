[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# For parallel test execution: pytest -n auto
# Or with a specific worker count: pytest -n 4
# Note: -n auto is NOT in addopts to avoid breaking single-test runs and debugger sessions
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=scripts
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    serial: Tests that must run sequentially (not compatible with xdist parallel execution)

